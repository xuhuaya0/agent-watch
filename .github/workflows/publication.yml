name: Publication metadata guard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python tools/check_publication.py
